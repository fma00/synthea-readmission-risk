# Local hooks only. ruff and zizmor run from the MAIN checkout's .venv (created by `make setup`), found through git's
# common directory, so the hooks also work in linked worktrees (e.g. .claude/worktrees/*), which share the hooks but
# have no .venv of their own. Their version is the hash-pinned one in requirements-dev.txt: no second, unhashed version
# source. pre-commit does not put any venv on PATH, hence the explicit path. With no .venv in the main checkout those two
# hooks fail ("not found", exit 127) and block the commit. terraform-fmt runs the `terraform` on PATH (unpinned) on the
# staged infra/*.tf files and skips with a notice when there is none, because CI's terraform-validate job checks
# formatting with a pinned Terraform. zizmor runs offline here; CI (ci.yml) runs ruff, online zizmor and terraform fmt
# again, so `git commit --no-verify` skips nothing CI does not catch.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: sh -c 'exec "$(git rev-parse --git-common-dir)/../.venv/bin/ruff" check --force-exclude "$@"' --
        language: unsupported
        types_or: [python, pyi, jupyter]
      - id: zizmor
        name: zizmor (offline)
        entry: sh -c 'exec "$(git rev-parse --git-common-dir)/../.venv/bin/zizmor" --offline .' --
        language: unsupported
        files: ^(\.github/|\.pre-commit-config\.yaml$)
        pass_filenames: false
      # verbose: pre-commit hides a passing hook's output, and the skip notice must be visible. No ": " in the notice:
      # a colon followed by a space would end this YAML plain scalar.
      - id: terraform-fmt
        name: terraform fmt -check (infra/)
        entry: sh -c 'command -v terraform >/dev/null 2>&1 || { echo "terraform not on PATH, skipped (CI terraform-validate checks formatting)"; exit 0; }; exec terraform fmt -check -diff "$@"' --
        language: unsupported
        files: ^infra/.*\.tf$
        verbose: true
