# Proposes updates to the SHA-pinned actions in .github/workflows/ and to the Terraform provider in infra/ (its version
# and .terraform.lock.hcl hashes) as pull requests; nothing updates without a merge. Python dependencies are excluded:
# they are hash-locked with pip-compile (see docs/setup.md), which Dependabot's pip updater would fight. The cooldown
# skips releases younger than 7 days, so a compromised release is usually pulled before it is ever proposed. Action
# majors are not in the group and arrive as one PR each; the Terraform entry has no group (there is one provider). The
# Terraform CLI itself is pinned in ci.yml with a SHA256 and is bumped by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
