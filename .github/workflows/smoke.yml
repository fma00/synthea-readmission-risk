name: GCP smoke

# Keyless proof of the WIF path (v2 slice 3, PRD FR9): exchanges this job's GitHub OIDC token for a short-lived token of
# the gha-smoke service account and lists the bundle bucket. No service-account key exists anywhere. Dispatch only; the
# WIF provider (infra/wif.tf) accepts only refs/heads/main and workflow_dispatch/schedule events, and gha-smoke is bound
# to this file's workflow_ref (infra/iam.tf). The values below must match infra/ (tests/test_infra.py checks them).
on:
  workflow_dispatch:

permissions: {}

jobs:
  list-bundles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # id-token only here, at job level, on a dispatch-only workflow (PRD FR0.2).
    permissions:
      contents: read
      id-token: write
    steps:
      # The auth action writes its credentials file into $GITHUB_WORKSPACE and its README requires checkout first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No token_format: no access token is minted for the service account or exposed as a step output. The action
      # (v3.0.0) still performs the STS federated-token exchange itself, so a refused attribute condition fails THIS
      # step (measured at V-post, 2026-10-18); an IAM getAccessToken (binding) error would surface in the next step.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: projects/271458030145/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: gha-smoke@synthea-readmission-risk.iam.gserviceaccount.com

      - name: List the bundle bucket
        run: gcloud storage ls gs://synthea-readmission-risk-bundles/
