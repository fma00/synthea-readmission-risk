name: CI

on:
  push:
    # Pushes to other branches get CI through their pull request; running on both would double every PR's jobs.
    branches: [main]
  pull_request:

# Least privilege: this workflow only checks out code, lints, tests, audits workflows and validates the Terraform config.
permissions:
  contents: read

# Pull requests: one group per PR, so a new push cancels the superseded run. Pushes to main: one group per commit, so
# no run on main is ever cancelled, not even while pending (GitHub keeps one pending run per group and cancels the
# older one). github.ref differs between push and pull_request, so the old ref-only group never merged a push with
# its PR; the push filter above is what prevents the double run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Every `uses:` is pinned to a full commit SHA with a `# vX.Y.Z` comment: a tag can be moved by whoever controls the
# action's repository, a commit cannot. Dependabot (.github/dependabot.yml) proposes updates as PRs; the
# audit-workflows job fails on an unpinned action, a comment that does not match its SHA, or a known-vulnerable action.
jobs:
  lint-and-test:
    # 3.14 is the development interpreter (.python-version) and runs the full suite. Python 3.12 / Spark 4.0.x, the
    # Dataproc runtime the Big Join targets, is covered for the pipeline only, by pipeline-dataproc-runtime below.
    # Pinned, not ubuntu-latest: GitHub moves that label to Ubuntu 26 on 2026-10-19, and a runner-image change should not
    # turn CI red unannounced in a project whose dependencies are hash-pinned. Move it deliberately, after a green run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # CI never pushes; do not leave the job token in .git/config for later steps.
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # The floating minor, like audit-workflows: an exact .python-version patch may not be on the runner yet.
          python-version: "3.14"
          # The install pulls pyspark, mlflow and xgboost (hundreds of MB); cache the wheels, keyed on the
          # lockfiles so a dependency change invalidates the cache automatically.
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-linux-extras.txt

      - name: Install dependencies
        run: |
          pip install -e .
          pip install --require-hashes -r requirements.txt -r requirements-linux-extras.txt
          pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -rs

  # The Big Join runs on Dataproc Serverless runtime 3.0 (Python 3.12, Spark 4.0.x, Java 21; the mirror pins the 4.0.2 the live runtime ran), not on the 3.14 /
  # PySpark 4.1.3 stack above. This job installs a hash-locked mirror of that runtime's libraries
  # (requirements-dataproc-3.0.in says where the versions come from) and runs the pipeline tests under it. It is the only
  # Python 3.12 coverage: training, scoring and reporting run on 3.14 only.
  pipeline-dataproc-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dataproc-3.0.txt

      - name: Install the runtime 3.0 dependency set
        run: |
          pip install -e .
          pip install --require-hashes -r requirements-dataproc-3.0.txt
          pip check

      - name: Test the pipeline
        env:
          # Turns on test_runtime_dependencies.py's environment check (Python, Spark, library minors, Java 21), so a
          # green run proves this job ran the intended stack, not merely that some stack passed.
          READMISSION_RISK_EXPECT_DATAPROC_RUNTIME: "3.0"
        run: pytest -rs tests/pipeline tests/scripts

  # Runs zizmor ONLINE: some audits (known-vulnerable-actions, impostor-commit, and in practice ref-version-mismatch)
  # need the GitHub API. So this job can turn red without a commit, e.g. when an advisory is published for a pinned
  # action; that is the point (bump the action). It is a separate job so its result never hides lint/test results.
  audit-workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # The floating minor, like lint-and-test: an exact .python-version patch may not be on the runner yet.
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install zizmor
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        # --gh-token makes a missing token an error; without it zizmor would silently skip the online audits.
        run: zizmor --gh-token "$GH_TOKEN" .

  # Static checks of infra/ only: fmt, init WITHOUT a backend (no GCS, no credentials) and validate. Never plan or
  # apply: Terraform is applied from the laptop (PRD FR8). The CLI comes from HashiCorp's release zip, checked against
  # a pinned SHA256 (from terraform_<version>_SHA256SUMS) rather than through a setup action; bump both env values
  # together with infra/versions.tf's required_version (tests/test_infra.py keeps them in agreement).
  terraform-validate:
    runs-on: ubuntu-24.04
    env:
      TERRAFORM_VERSION: "1.16.5"
      TERRAFORM_SHA256: "2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        run: |
          curl -fsSLo "$RUNNER_TEMP/terraform.zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/terraform-bin"
          echo "$RUNNER_TEMP/terraform-bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: terraform -chdir=infra fmt -check -recursive -diff

      - name: Initialise without a backend
        # -lockfile=readonly: the providers must match infra/.terraform.lock.hcl's hashes, and the file is never updated.
        run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform -chdir=infra validate
