name: CI

on:
  push:
  pull_request:

# Least privilege: this workflow only checks out code, lints and tests.
permissions:
  contents: read

# A push to a branch that also has an open PR would otherwise run this workflow twice; and a new push
# makes an in-flight run for the same ref obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    # Pinned, not ubuntu-latest: GitHub moves that label to Ubuntu 26 on 2026-10-19, and a runner-image change should not
    # turn CI red unannounced in a project whose dependencies are hash-pinned. Move it deliberately, after a green run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # The install pulls pyspark, mlflow and xgboost (hundreds of MB); cache the wheels, keyed on the
          # lockfiles so a dependency change invalidates the cache automatically.
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-linux-extras.txt

      - name: Install dependencies
        run: |
          pip install -e .
          pip install --require-hashes -r requirements.txt -r requirements-linux-extras.txt
          pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
