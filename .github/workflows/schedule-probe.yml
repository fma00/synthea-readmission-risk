name: Schedule probe

# Temporary diagnostics (v2 slice 7, 2026-10-19): monitor.yml's burn-in cron produced no scheduled run for six slots,
# while workflow_dispatch works. This workflow only prints the time, every 15 minutes off the hour, to show whether
# GitHub's scheduler fires anything for this repository. No permissions, no credentials. Removed after the diagnosis.
on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print the time
        run: date -u
