name: Monitoring tick
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.cadence == 'burn_in' && 'Monitoring tick (burn-in)' || 'Monitoring tick' }}

# The monitoring tick on a SIMULATED clock (v2 slice 7, PRD FR19-FR21): each run advances the simulated date by one week
# through the champion's held-out 2023-2026 discharges, scores that week into BigQuery (write-audit-publish, slice 4),
# evaluates the 13-week cohort whose labels have matured (observed/expected with an exact Poisson CI, the pre-registered
# rule in prereg.yaml), records one serving.monitoring row, renders the run ledger (job A) and commits it to the `ledger`
# branch (job B), and opens or updates one GitHub issue per kind on a failure or an alert. Keyless: three service
# accounts are bound to this file's workflow_ref (infra/iam.tf); the WIF provider accepts only refs/heads/main and
# workflow_dispatch/schedule. Cron states (exactly one at a time, tests/test_infra.py): none (Part 1 of
# notes/eg-new-feature/monitoring-burn-in-timer-and-weekly-retry-2026-10-20.md), then the weekly retry cron (Part 2);
# the burn-in is dispatched by a laptop timer (make burn-in-timer), not scheduled. The values below must match deploy/
# and infra/. Design: notes/eg-new-feature/v2-slice7-monitoring-tick-ledger-2026-10-18.md.
on:
  workflow_dispatch:
    inputs:
      sim_date:
        description: "Optional YYYYMMDD on the simulated grid, at or before the clock head (replay); empty = the head"
        required: false
        type: string
      cadence:
        description: "dispatch (default) or burn_in (used only by the laptop burn-in timer, make burn-in-timer)"
        required: false
        type: choice
        options: [dispatch, burn_in]
        default: dispatch

permissions: {}

# Shared with score.yml: at most one scoring run executes; a newer run replaces an older PENDING one (dropped, not failed).
concurrency:
  group: score
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      sim_date: ${{ steps.clock.outputs.sim_date }}
      cadence: ${{ steps.clock.outputs.cadence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No pip cache in a job that holds cloud credentials (zizmor cache-poisoning); the installs are hash-checked.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements.txt -r requirements-linux-extras.txt
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: projects/271458030145/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: monitor@synthea-readmission-risk.iam.gserviceaccount.com
      - name: Clock
        id: clock
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_SIM_DATE: ${{ inputs.sim_date }}
          REQUESTED_CADENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.cadence || '' }}
        run: python scripts/monitor_tick.py clock

  score:
    needs: clock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      scoring_run_id: ${{ steps.score.outputs.scoring_run_id }}
      status: ${{ steps.score.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements.txt -r requirements-linux-extras.txt
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: projects/271458030145/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: scorer@synthea-readmission-risk.iam.gserviceaccount.com
      # Diagnostics (slice 7, L11): hosted runners differ in CPU; on AVX-512 CPUs numpy takes other SIMD paths, which can
      # change the last bits of a few scores (ranks, Top-N and metrics unchanged). Read-only; prints to the log only.
      - name: Record the runner's CPU and BLAS
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)|Flags)' | cut -c1-200
          python -c "import json, numpy, threadpoolctl; print(json.dumps(threadpoolctl.threadpool_info(), indent=1)); numpy.show_runtime()"
      - name: Score
        id: score
        env:
          SIM_DATE: ${{ needs.clock.outputs.sim_date }}
        run: python scripts/score_to_bigquery.py --gold-dir gs://synthea-readmission-risk-gold/v2/main_200k --run-date "$SIM_DATE" --window-days 7 --top-n 10

  evaluate:
    needs: [clock, score]
    if: always() && needs.clock.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      status: ${{ steps.evaluate.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements.txt -r requirements-linux-extras.txt
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: projects/271458030145/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: monitor@synthea-readmission-risk.iam.gserviceaccount.com
      - name: Evaluate
        id: evaluate
        env:
          SIM_DATE: ${{ needs.clock.outputs.sim_date }}
          CADENCE: ${{ needs.clock.outputs.cadence }}
          SCORING_RUN_ID: ${{ needs.score.outputs.scoring_run_id }}
          SCORE_RESULT: ${{ needs.score.result }}
        run: python scripts/monitor_tick.py evaluate --sim-date "$SIM_DATE" --cadence "$CADENCE" --scoring-run-id "$SCORING_RUN_ID" --score-result "$SCORE_RESULT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: evaluation
          path: monitor_out/
          if-no-files-found: ignore
          overwrite: true

  ledger-render:
    needs: [clock, evaluate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install --require-hashes -r requirements.txt -r requirements-linux-extras.txt
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: projects/271458030145/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: ledger-reader@synthea-readmission-risk.iam.gserviceaccount.com
      - name: Render
        run: python scripts/render_ledger.py --out-dir ledger_out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ledger
          path: ledger_out/
          overwrite: true

  # Job B: repository write, NO cloud credentials; runs only the one checked-out script on the runner's system Python.
  ledger-commit:
    needs: ledger-render
    if: always() && needs.ledger-render.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/publish_ledger.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ledger
          path: ledger_out
      - name: Commit to the ledger branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_ledger.py --in-dir ledger_out --branch ledger

  issues:
    needs: [clock, score, evaluate, ledger-render, ledger-commit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/tick_issues.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          name: evaluation
          path: monitor_out
      - name: Open or update issues
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/tick_issues.py --results-json "$RESULTS" --evaluation monitor_out/evaluation.json --run-url "$RUN_URL"
